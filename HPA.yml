apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-hpa  # Ensure this matches your actual Deployment name
  minReplicas: 2
  maxReplicas: 10   # when should I add or remove pods?
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 1  # Aim for 1% CPU utilization

